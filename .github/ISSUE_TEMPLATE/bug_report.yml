name: Something is wrong
description: A part answers something it should not, or nothing works at all
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most reports here turn out to be a missing submodule, an image that is
        not the one the part expects, or a Python that is too old. All three look
        identical from outside, so the first field asks you to run one command
        that tells all of us which it is.

  - type: textarea
    id: doctor
    attributes:
      label: What the doctor says
      description: |
        Run this from the repository and paste every line, including the ones
        that did not pass. Those are the ones worth reading, so do not trim it.

        macOS and Linux:

            python3 -m snesdsp.doctor

        Windows, whichever of these resolves:

            python -m snesdsp.doctor
            py -3 -m snesdsp.doctor

        It reports the machine as well as the package, so most answers are in
        there already. If it will not run at all, say so here and paste whatever
        it printed instead.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: For a wrong answer, say which part, which command, and what the hardware gives.
      placeholder: |
        dsp1, command 0x28 with (0x15B9, 0x0AA7, 0x1A44), should be 8908
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: |
        The exact output or the whole traceback. Paste it rather than describing
        it: a summary of an error loses the part that identifies it.
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: The shortest thing that shows it
      description: Python we can run as it stands, with no editing.
      render: python
      placeholder: |
        from snesdsp import Chip

        chip = Chip("dsp1")
        chip.write(0x28)
    validations:
      required: true

  - type: input
    id: cartridge
    attributes:
      label: The game, if one is involved
      description: |
        Its name and its SHA-256. Never attach the file itself, and never link
        to somewhere it can be downloaded: the digest is what identifies it and
        it is all anybody needs.
      placeholder: "Super Mario Kart (USA), sha256 ..."

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: The doctor output above is complete rather than trimmed
          required: true
        - label: I own the microcode and the game I am naming, and I have attached neither
          required: true
