---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Format and lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pipx install ruff==0.16.3

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check --output-format=github .

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install the formatter
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check that every JSON file is formatted
        run: pnpm run format:check

      - name: Check the workflows themselves, from an archive verified by digest
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
          rm -f actionlint actionlint.tar.gz
        shell: bash
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"

      - name: Lint every YAML file
        run: |
          pipx install yamllint==1.38.0
          yamllint --strict .

  types:
    name: Types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install the type checker and the build backend's stubs
        run: |
          pipx install mypy==1.14.1
          pipx inject mypy types-setuptools==84.0.0.20260812

      - name: Every annotation has to hold
        run: mypy

  test:
    name: Tests on Python ${{ matrix.python }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install coverage and the build backend its tests drive
        run: |
          python -m pip install --disable-pip-version-check \
            coverage==7.6.10 setuptools==84.0.0

      - name: Run every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesdsp conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must be total
        run: python -m coverage report

  speed:
    name: Throughput
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: The part must still run faster than the floor
        run: python -m conformance.speed

  quotes:
    name: Every quoted sentence, against the document it came from
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Every quoted sentence, against the document it came from
        run: python -m conformance.quotes

  firmware:
    name: Against the parts, when any microcode is present
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Drive the parts with the exchanges real cartridges make, exit 2 meaning no microcode
        run: |
          set +e
          status=0
          for part in dsp1 dsp2 dsp3 dsp4; do
            echo "::group::${part}"
            python -m conformance.against_cartridges "${part}" | tee -a report.txt
            here=${PIPESTATUS[0]}
            echo "::endgroup::"
            [ "${here}" -eq 0 ] || status="${here}"
          done
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The checks that run a part's own program did not run."
            notice="${notice} They are not failures; they had nothing to run."
            echo "::notice title=No microcode present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: Every part still answers what it answered
        run: |
          set +e
          python -m conformance.answers
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The recorded answers were not re-derived."
            notice="${notice} They are not failures; there was nothing to run."
            echo "::notice title=No microcode present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: The DSP-1B correction is still where it was
        run: |
          set +e
          python -m conformance.masks
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The mask comparison needs an image for the DSP-1 and the DSP-1B."
            notice="${notice} It did not run."
            echo "::notice title=Both DSP-1 masks not present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: Every example in the README still gives what it says
        run: |
          set +e
          python -m conformance.documented
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The README examples were not run."
            notice="${notice} They are not failures; they had nothing to run."
            echo "::notice title=No microcode present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

  package:
    name: package
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Every module ships and no test does
        run: python -m conformance.package dist/snesdsp-*.whl
