---
name: Weekly

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ahead:
    name: On Python ${{ matrix.python }}, newest tools
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Take the newest processor rather than the pinned one
        run: git submodule update --remote --recursive

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true

      - name: Install the newest tools, unpinned on purpose
        run: |
          python -m pip install --disable-pip-version-check \
            --upgrade ruff mypy coverage setuptools types-setuptools

      - name: Formatting, as the newest formatter sees it
        run: ruff format --check .

      - name: Lint, with whatever rules were added since
        run: ruff check --output-format=github .

      - name: Types, as the newest checker sees them
        run: mypy

      - name: Every test file, under coverage
        run: |
          python -m coverage erase
          status=0
          while IFS= read -r file; do
            echo "::group::${file}"
            python -m coverage run -a "${file}" || status=1
            echo "::endgroup::"
          done < <(find snesdsp conformance -name '*.test.py' | sort)
          exit "${status}"
        shell: bash

      - name: Coverage must still be total
        run: python -m coverage report

      - name: No microcode reaches past the stack the part has, weekly as it takes twenty minutes
        run: |
          set +e
          python -m conformance.stack
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The stack measurement did not run."
            notice="${notice} It is not a failure; it had nothing to run."
            echo "::notice title=No microcode present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash

      - name: The documented examples still give what they say
        run: |
          set +e
          python -m conformance.documented
          status=$?
          set -e
          if [ "${status}" -eq 2 ]; then
            notice="The documented examples did not run."
            notice="${notice} They are not failures; they had nothing to run."
            echo "::notice title=No microcode present::${notice}"
            exit 0
          fi
          exit "${status}"
        shell: bash
