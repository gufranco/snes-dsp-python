---
name: Submodule watch

on:
  schedule:
    - cron: "51 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: submodule-watch
  cancel-in-progress: false

jobs:
  ask:
    name: Ask every submodule whether it is at its head
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Compare every pin against its upstream, never reading a failed lookup as behind
        id: compare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=""
          while read -r sha where; do
            url=$(git config -f .gitmodules --get "submodule.${where}.url")
            repo=$(echo "${url%.git}" | sed -E 's#^.*[:/]([^/]+/[^/]+)$#\1#')
            branch=$(gh api "repos/${repo}" --jq '.default_branch' 2>/dev/null || echo "")
            head=$(gh api "repos/${repo}/commits/${branch}" --jq '.sha' 2>/dev/null || echo "")
            case "${head}" in
              [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
              *)
                echo "could not ask ${repo}, which is not the same as being behind"
                continue
                ;;
            esac
            if [ "${head}" != "${sha}" ]; then
              count=$(git -C "${where}" rev-list --count "${sha}..${head}" \
                2>/dev/null || echo "?")
              line="- \`${where}\` is at \`${sha:0:12}\`, upstream is at \`${head:0:12}\`"
              behind="${behind}${line}, ${count} commits ahead"$'\n'
              echo "behind: ${where}"
            else
              echo "at its head: ${where}"
            fi
          done < <(git submodule status | sed -E 's/^[ +-]//' | awk '{print $1, $2}')
          {
            echo "behind<<REPORT"
            printf '%s' "${behind}"
            echo "REPORT"
          } >> "${GITHUB_OUTPUT}"
        shell: bash

      - name: Report the pins that have fallen behind
        if: steps.compare.outputs.behind != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEHIND: ${{ steps.compare.outputs.behind }}
        run: |
          title="A submodule is behind its upstream"
          open=$(gh issue list --search "${title} in:title" \
            --state open --json number --jq '.[].number')
          if [ -n "${open}" ]; then
            echo "already reported"
            exit 0
          fi
          {
            cat .github/submodule-behind.md
            printf '\n%s\n' "${BEHIND}"
          } > /tmp/issue.md
          gh issue create --title "${title}" --body-file /tmp/issue.md
        shell: bash
